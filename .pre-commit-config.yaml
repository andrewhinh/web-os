repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        files: (Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|\.cargo/|crates/|\.rs$)
        pass_filenames: false

      - id: rustfmt-check
        name: cargo fmt -- --check
        entry: cargo fmt -- --check
        language: system
        files: (Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|\.cargo/|crates/|\.rs$)
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy -- -D warnings
        entry: cargo clippy -- -D warnings
        language: system
        files: (Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|\.cargo/|crates/|\.rs$)
        pass_filenames: false

      - id: cargo-test-kernel
        name: cd crates/kernel && cargo test
        entry: bash -c 'cd crates/kernel && cargo test'
        language: system
        files: (Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|\.cargo/|crates/kernel/|\.rs$)
        pass_filenames: false

      - id: cargo-test-rest
        name: cargo test --workspace --exclude libkernel
        entry: cargo test --workspace --exclude libkernel
        language: system
        files: (Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|rustfmt\.toml|\.cargo/|crates/(?!kernel/)|\.rs$)
        pass_filenames: false

      - id: vp-check-fix
        name: vp check --fix
        entry: bash -c 'export CI=true; test -d node_modules || vp install; vp check --fix'
        language: system
        files: ^(src/|static/|svelte\.config\.js$|vite\.config\.ts$|postcss\.config\.cjs$|tsconfig\.json$|package\.json$|pnpm-lock\.yaml$)
        pass_filenames: false

      - id: vp-test
        name: vp test
        entry: bash -c 'export CI=true; test -d node_modules || vp install; vp test'
        language: system
        files: ^(src/|static/|svelte\.config\.js$|vite\.config\.ts$|postcss\.config\.cjs$|tsconfig\.json$|package\.json$|pnpm-lock\.yaml$)
        pass_filenames: false

      - id: vp-build
        name: vp build
        entry: bash -c 'export CI=true; test -d node_modules || vp install; vp build'
        language: system
        files: ^(src/|static/|svelte\.config\.js$|vite\.config\.ts$|postcss\.config\.cjs$|tsconfig\.json$|package\.json$|pnpm-lock\.yaml$)
        pass_filenames: false
